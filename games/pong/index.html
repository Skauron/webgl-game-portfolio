<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Pong Multiplayer — WebGL Portfolio</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: sans-serif;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container {
        position: relative;
        width: min(90vw, calc(90vh * 800 / 450));
        height: min(90vh, calc(90vw * 450 / 800));
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #050505;
      }
      #hud {
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        text-shadow: 0 0 4px #000;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.75);
        text-align: center;
      }
      #overlay.visible {
        display: flex;
      }
      #countdown {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 15vh;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.7);
        pointer-events: none;
      }
      #countdown.visible {
        display: flex;
      }
      #touch-controls {
        display: none;
        position: fixed;
        right: 16px;
        bottom: 16px;
        flex-direction: column;
        gap: 8px;
        z-index: 10;
      }
      @media (pointer: coarse) {
        #touch-controls {
          display: flex;
        }
      }
      .touch-btn {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        width: 56px;
        height: 56px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .touch-btn:active {
        background: rgba(255, 255, 255, 0.35);
      }
      #back-link {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 20;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        padding: 6px 12px;
      }
      #back-link:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <a id="back-link" href="../../">← Portfolio</a>
    <div id="game-container">
      <canvas id="viewport" width="800" height="450"></canvas>
      <div id="hud">
        <span id="score">0 — 0</span>
        <span id="status">Connecting…</span>
      </div>
      <div id="overlay">
        <div id="overlay-message"></div>
      </div>
      <div id="countdown"></div>
    </div>
    <div id="touch-controls">
      <button class="touch-btn" id="btn-up">▲</button>
      <button class="touch-btn" id="btn-down">▼</button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
