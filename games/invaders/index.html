<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Space Invaders — WebGL Portfolio</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        font-family: sans-serif;
        color: #fff;
      }
      #game-container {
        position: relative;
        width: 480px;
        height: 480px;
        margin: 40px auto;
      }
      canvas {
        display: block;
        background: #050505;
      }
      #hud {
        position: absolute;
        top: 8px;
        left: 8px;
        font-size: 14px;
        display: flex;
        gap: 16px;
        text-shadow: 0 0 4px #000;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.75);
        text-align: center;
      }
      #overlay.visible {
        display: flex;
      }
      #overlay button {
        margin-top: 12px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="viewport" width="480" height="480"></canvas>
      <div id="hud">
        <span id="score">Score: 0</span>
        <span id="lives">Lives: 3</span>
      </div>
      <div id="overlay">
        <div id="overlay-message"></div>
        <button id="restart-button">Restart</button>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
